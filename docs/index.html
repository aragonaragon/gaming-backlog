<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبة ألعابي — Backlog Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050913;
    --panel:#0b1426;
    --panel2:#101b31;
    --panel3:#15243d;
    --ink:#f5f8ff;
    --muted:#9aa9c4;
    --dim:#5e6f90;
    --line:rgba(151,185,255,.13);
    --line2:rgba(151,185,255,.24);
    --accent:#31a9ff;
    --accent2:#69e6ff;
    --accent3:#8b7cff;
    --accentSoft:rgba(49,169,255,.16);
    --gold:#ffd166;
    --playing:#4cc9f0;
    --done:#55d68b;
    --red:#ff6b7a;
    --shadow:0 24px 80px rgba(0,10,32,.55);
    --r:8px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; font-family:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
    background:
      radial-gradient(900px 520px at 78% -10%, rgba(49,169,255,.18), transparent 62%),
      radial-gradient(760px 520px at 10% 15%, rgba(139,124,255,.13), transparent 64%),
      linear-gradient(180deg,#050913 0%,#081020 52%,#050913 100%);
    color:var(--ink); min-height:100vh;
    -webkit-font-smoothing:antialiased;
    letter-spacing:0;
  }
  a{color:inherit; text-decoration:none}
  button,input,select{font:inherit; letter-spacing:0}
  ::selection{background:rgba(49,169,255,.36)}
  .app{max-width:1420px; margin:0 auto; padding:18px 18px 76px}

  /* ---------- app bar ---------- */
  .appbar{
    position:sticky; top:0; z-index:40; padding:10px 0 14px;
    background:linear-gradient(180deg,rgba(5,9,19,.96) 0%,rgba(5,9,19,.84) 78%,transparent 100%);
    backdrop-filter:blur(14px);
  }
  .topline{display:grid; grid-template-columns:auto minmax(260px,1fr); align-items:center; gap:14px}
  .brand{display:flex; align-items:center; gap:11px}
  .logo{
    width:42px; height:42px; border-radius:8px; flex-shrink:0;
    background:linear-gradient(145deg,rgba(49,169,255,.2),rgba(139,124,255,.16)); border:1px solid rgba(105,230,255,.38);
    display:flex; align-items:center; justify-content:center; color:var(--accent2);
    box-shadow:0 0 28px rgba(49,169,255,.16), inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .logo span{font-size:19px; transform:translateY(-1px)}
  .brand h1{margin:0; font-size:19px; font-weight:900; letter-spacing:0}
  .brand p{margin:1px 0 0; color:var(--muted); font-size:12px; font-weight:600}

  .searchbox{position:relative; flex:1; min-width:0}
  .sfield{position:relative}
  .sfield input{
    width:100%; background:rgba(9,18,34,.9); color:#fff; border:1px solid var(--line2);
    border-radius:8px; padding:15px 52px 15px 18px; font-size:16px; font-weight:700;
    transition:border-color .18s, background .18s, box-shadow .18s;
  }
  .sfield input::placeholder{color:var(--dim); font-weight:400}
  .sfield input:focus{outline:none; border-color:rgba(105,230,255,.8); background:#0d1a31; box-shadow:0 0 0 4px rgba(49,169,255,.14)}
  .sicon{position:absolute; top:50%; transform:translateY(-50%); inset-inline-end:18px;
    font-size:17px; color:var(--muted); pointer-events:none}
  .searchbox.loading .sicon{animation:spin .8s linear infinite; color:var(--accent)}
  @keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}
  .results{position:absolute; top:calc(100% + 8px); inset-inline:0; z-index:50;
    background:#0b1426; border:1px solid var(--line2); border-radius:8px;
    overflow:hidden auto; max-height:62vh; display:none;
    box-shadow:var(--shadow)}
  .results.show{display:block}
  .results::-webkit-scrollbar{width:9px}
  .results::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:8px}
  .rrow{display:flex; align-items:center; gap:13px; padding:10px 13px;
    border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s}
  .rrow:last-child{border-bottom:0}
  .rrow:hover{background:rgba(49,169,255,.1)}
  .rthumb{width:76px; height:43px; border-radius:6px; object-fit:cover; background:#0a0d14; flex-shrink:0}
  .rthumb.noimg{display:flex; align-items:center; justify-content:center; color:#2e3548; font-size:17px}
  .rinfo{flex:1; min-width:0}
  .rname{color:#fff; font-weight:700; font-size:14px; direction:ltr; text-align:start;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .rmeta{color:var(--muted); font-size:12px; margin-top:2px; font-weight:500}
  .radd{flex-shrink:0; background:var(--accent); color:#04101f; border:0; border-radius:8px;
    padding:9px 14px; font-size:13px; font-weight:900; cursor:pointer; transition:.15s}
  .radd:hover{background:var(--accent2)}
  .radd.added{background:rgba(66,196,136,.15); color:var(--done); cursor:default}
  .rnote{padding:16px; color:var(--muted); font-size:13.5px; text-align:center}

  /* ---------- intro panel ---------- */
  .hero-panel{
    min-height:260px; display:grid; grid-template-columns:minmax(280px,.82fr) minmax(420px,1.18fr);
    gap:14px; align-items:stretch; margin:8px 0 16px;
  }
  body.has-library .hero-panel{display:none}
  .hero-copy{
    position:relative; overflow:hidden; border:1px solid var(--line);
    background:
      linear-gradient(135deg,rgba(12,24,48,.96),rgba(7,13,26,.98)),
      radial-gradient(400px 220px at 15% 20%, rgba(49,169,255,.18), transparent 65%);
    padding:26px; border-radius:8px; min-height:260px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .hero-copy::before{
    content:""; position:absolute; inset-inline-start:0; inset-block:0; width:4px;
    background:linear-gradient(180deg,var(--accent2),var(--accent),var(--accent3));
  }
  .hero-copy .eyebrow{margin:0 0 9px; color:var(--accent2); font-size:13px; line-height:1.4; font-weight:900}
  .hero-copy h2{margin:0; max-width:520px; font-size:35px; line-height:1.12; font-weight:900}
  .hero-copy p:not(.eyebrow){margin:12px 0 0; max-width:560px; color:var(--muted); font-size:15px; line-height:1.8; font-weight:600}
  .hero-stats{display:flex; flex-wrap:wrap; gap:8px; margin-top:22px}
  .hero-stats span{
    display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 11px;
    border:1px solid var(--line); color:#dcd7ca; background:rgba(255,255,255,.035);
    border-radius:8px; font-size:12px; font-weight:800;
  }
  .hero-art{
    position:relative; min-height:310px; border-radius:8px; overflow:hidden; border:1px solid var(--line);
    background-image:
      linear-gradient(90deg,rgba(5,9,19,.2),rgba(5,9,19,.38)),
      linear-gradient(135deg,rgba(49,169,255,.26),rgba(139,124,255,.12)),
      url("assets/game-library-hero.png");
    background-size:cover; background-position:center; box-shadow:var(--shadow);
  }
  .hero-art::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg,transparent 48%,rgba(5,9,19,.52));
    pointer-events:none;
  }
  .art-chip{
    position:absolute; inset-inline-end:16px; inset-block-end:16px; z-index:1;
    display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;
  }
  .art-chip span{
    padding:8px 10px; border:1px solid rgba(255,255,255,.18); border-radius:8px;
    background:rgba(9,10,10,.62); color:#fff; backdrop-filter:blur(10px);
    font-size:12px; font-weight:800;
  }

  /* ---------- bento dashboard ---------- */
  .bento{display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:118px;
    gap:12px; grid-auto-flow:dense; margin-bottom:26px}
  .tile{background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    padding:16px; position:relative; overflow:hidden; transition:border-color .18s, transform .18s}
  .tile.tap{cursor:pointer}
  .tile.tap:hover{border-color:rgba(105,230,255,.42); transform:translateY(-2px)}

  /* play-next hero */
  .tile.play{grid-column:span 2; grid-row:span 2; padding:0; display:flex;
    align-items:flex-end; border-color:var(--line2)}
  .play .pbg{position:absolute; inset:0; background-size:cover; background-position:center}
  .play .pbg::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(5,9,19,.12) 18%,rgba(5,9,19,.95))}
  .play .pcontent{position:relative; padding:20px; width:100%}
  .play .plabel{display:inline-flex; align-items:center; gap:6px; font-size:11.5px;
    font-weight:900; color:#04101f; background:var(--accent2); padding:5px 11px;
    border-radius:8px; margin-bottom:11px}
  .play .ptitle{font-size:24px; font-weight:800; color:#fff; direction:ltr; text-align:start;
    line-height:1.2; margin-bottom:9px; text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .play .pmeta{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:15px}
  .play .pm{font-size:12px; font-weight:600; color:#dfe3ee; background:rgba(255,255,255,.1);
    padding:4px 10px; border-radius:8px; backdrop-filter:blur(4px)}
  .play .pm.star{color:#1c1503; background:var(--gold)}
  .play .pbtns{display:flex; gap:9px}
  .play .pbtn{border:0; border-radius:8px; padding:12px 18px; font-size:14px; font-weight:900;
    cursor:pointer; transition:.15s; display:inline-flex; align-items:center; gap:7px}
  .play .pbtn.go{background:var(--accent2); color:#04101f}
  .play .pbtn.go:hover{transform:translateY(-1px)}
  .play .pbtn.alt{background:rgba(255,255,255,.14); color:#fff; backdrop-filter:blur(4px)}
  .play .pbtn.alt:hover{background:rgba(255,255,255,.22)}
  .play.empty{align-items:center; justify-content:center; text-align:center; padding:22px}
  .play.empty .pe{color:var(--muted)}
  .play.empty .pe b{display:block; color:#fff; font-size:17px; font-weight:800; margin-bottom:6px}

  /* stat tiles */
  .stat{display:flex; flex-direction:column; justify-content:space-between}
  .stat .snum{font-size:30px; font-weight:800; line-height:1; letter-spacing:0}
  .stat .slabel{font-size:12.5px; color:var(--muted); font-weight:600}
  .stat .stop{display:flex; align-items:center; justify-content:space-between}
  .stat .sico{width:30px; height:30px; border-radius:8px; display:flex; align-items:center;
    justify-content:center; font-size:15px; background:var(--accentSoft); color:var(--accent)}
  .stat.c-play .sico{background:rgba(255,159,69,.14); color:var(--playing)}
  .stat.c-done .sico{background:rgba(67,201,138,.14); color:var(--done)}
  .stat.c-gold .sico{background:rgba(255,194,75,.14); color:var(--gold)}

  /* ring tile */
  .ring{display:flex; align-items:center; gap:14px}
  .ring .dial{width:74px; height:74px; border-radius:50%; flex-shrink:0; position:relative;
    display:flex; align-items:center; justify-content:center}
  .ring .dial::before{content:""; position:absolute; inset:9px; border-radius:50%; background:var(--panel)}
  .ring .dval{position:relative; font-size:18px; font-weight:800}
  .ring .rlabel{font-size:13px; color:var(--muted); font-weight:600; line-height:1.5}
  .ring .rlabel b{display:block; color:var(--ink); font-size:14px; font-weight:700}

  /* plan CTA tile (wide) */
  .tile.plant{grid-column:span 2; display:flex; align-items:center; gap:14px;
    background:linear-gradient(120deg,rgba(16,32,61,.95),rgba(8,15,31,.98))}
  .plant .pico{width:46px; height:46px; border-radius:8px; background:var(--accentSoft);
    color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0}
  .plant .ptxt b{display:block; font-size:16px; font-weight:800}
  .plant .ptxt span{font-size:12.5px; color:var(--muted)}
  .plant .parrow{margin-inline-start:auto; color:var(--muted); font-size:20px}

  /* ---------- library ---------- */
  .libhead{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px}
  .libhead h2{margin:0; font-size:17px; font-weight:800}
  .libhead .count{color:var(--dim); font-size:13px; font-weight:600}
  .controls{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-inline-start:auto}
  .controls input[type=text], .controls select{background:var(--panel); color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13.5px;
    font-family:inherit; font-weight:500; transition:border-color .15s}
  .controls input[type=text]:focus, .controls select:focus{outline:none; border-color:var(--accent)}
  .controls input[type=text]{width:150px}
  .controls select{cursor:pointer}
  .seg{display:flex; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:3px; gap:2px}
  .seg button{background:transparent; color:var(--muted); border:0; padding:7px 13px; cursor:pointer;
    font-size:13px; font-family:inherit; font-weight:800; border-radius:6px; transition:.15s}
  .seg button.active{background:var(--accent); color:#04101f}
  .seg button:hover:not(.active){color:#fff; background:rgba(255,255,255,.05)}
  .ibtn{background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px;
    width:38px; height:38px; padding:0; cursor:pointer; font-size:15px; font-weight:700; transition:.15s}
  .ibtn:hover{border-color:var(--line2); background:var(--panel2)}
  .pickbtn{
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#04101f;
    border:0; border-radius:8px; height:38px; padding:0 14px; cursor:pointer;
    font-size:13px; font-weight:900; box-shadow:0 12px 30px rgba(49,169,255,.18);
  }
  .pickbtn:hover{filter:brightness(1.08)}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(212px,1fr));
    grid-auto-flow:dense; gap:12px}
  .genre-groups{display:flex; flex-direction:column; gap:22px}
  .genre-section{min-width:0}
  .genre-title{display:flex; align-items:center; gap:10px; margin:0 0 10px; font-size:15px; font-weight:900; color:#fff}
  .genre-title::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--accent2); box-shadow:0 0 16px rgba(105,230,255,.55)}
  .genre-title span{color:var(--muted); font-size:12px; font-weight:800}
  .card{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    overflow:hidden; display:flex; flex-direction:column;
    transition:transform .2s cubic-bezier(.2,.7,.3,1), border-color .2s;
    animation:pop .38s cubic-bezier(.2,.7,.3,1) backwards}
  @keyframes pop{from{opacity:0; transform:translateY(12px)}to{opacity:1}}
  .card:hover{transform:translateY(-4px); border-color:rgba(105,230,255,.42)}
  .card.recommended{border-color:rgba(105,230,255,.9); box-shadow:0 0 0 1px rgba(105,230,255,.3),0 20px 50px rgba(49,169,255,.22)}
  .card.span2{grid-column:span 2}
  .card::before{content:""; position:absolute; inset-block-start:0; inset-inline:0; height:3px; z-index:3; opacity:0}
  .card.s-playing::before{opacity:1; background:var(--playing)}
  .card.s-done::before{opacity:1; background:var(--done)}
  .card.s-done{opacity:.72}
  .thumb{position:relative; aspect-ratio:16/9; background:#0a0d14; overflow:hidden}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s ease}
  .card:hover .thumb img{transform:scale(1.06)}
  .thumb .noimg{display:flex; align-items:center; justify-content:center; height:100%; color:#2a3146; font-size:42px}
  .thumb::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg,transparent 55%,rgba(5,9,19,.78)); pointer-events:none}
  .badge-status{position:absolute; top:9px; inset-inline-start:9px; padding:4px 10px; border-radius:8px;
    font-size:11px; font-weight:800; z-index:2; display:none}
  .card.s-playing .badge-status{display:block; background:var(--playing); color:#1a1305}
  .card.s-done .badge-status{display:block; background:var(--done); color:#06251a}
  .rating-chip{position:absolute; top:9px; inset-inline-end:9px; z-index:2; background:rgba(8,10,16,.78);
    border:1px solid rgba(255,194,75,.3); color:var(--gold); font-weight:800; font-size:12px;
    padding:4px 9px; border-radius:8px}
  .body{padding:12px 13px 13px; display:flex; flex-direction:column; gap:9px; flex:1}
  .title{font-size:15px; font-weight:700; line-height:1.3; direction:ltr; text-align:start}
  .title a{color:#fff}.title a:hover{color:var(--accent2)}
  .meta{display:flex; flex-wrap:wrap; gap:6px}
  .tag{background:rgba(255,255,255,.05); border:1px solid var(--line); color:#aeb6c8;
    font-size:11px; padding:3px 9px; border-radius:6px; font-weight:600}
  .tag.mc{color:#9fe6c0; background:rgba(67,201,138,.1); border-color:rgba(67,201,138,.25)}
  .timewrap{margin-top:auto; display:flex; flex-direction:column}
  .timerow{display:flex; gap:8px; align-items:stretch}
  .hcell{flex:1; background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:8px;
    padding:8px 6px; text-align:center}
  .hcell b{display:block; color:#fff; font-size:16px; font-weight:800}
  .hcell span{font-size:10px; color:var(--muted); font-weight:500}
  .hcell.custom{border-color:rgba(105,230,255,.45); background:var(--accentSoft)}
  .tedit{background:rgba(255,255,255,.03); color:var(--muted); border:1px dashed var(--line2);
    border-radius:8px; padding:0 13px; cursor:pointer; font-size:14px; font-family:inherit; transition:.15s}
  .tedit:hover{color:#fff; border-color:var(--accent); background:var(--accentSoft)}
  .tedit.wide{width:100%; padding:7px 0; margin-top:8px; font-size:12px; font-weight:600}
  .hedit{display:flex; gap:6px; margin-top:auto}
  .hedit input{flex:1; min-width:0; background:rgba(255,255,255,.04); color:#fff; border:1px solid var(--accent);
    border-radius:8px; padding:9px; text-align:center; font-size:14px; font-family:inherit}
  .hedit input:focus{outline:none}
  .hedit button{border:0; border-radius:8px; padding:9px 13px; cursor:pointer; font-family:inherit; font-size:14px; font-weight:800}
  .hsave{background:var(--done); color:#06251a}
  .hcancel{background:rgba(255,255,255,.08); color:#fff}
  .actions{display:flex; gap:7px; margin-top:2px}
  .actions button{flex:1; background:rgba(255,255,255,.04); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:8px 4px; cursor:pointer; font-size:12.5px; font-family:inherit; font-weight:700; transition:.15s}
  .actions button:hover{background:rgba(255,255,255,.08); color:#fff}
  .actions button.act-play.on{background:var(--playing); color:#1a1305; border-color:transparent}
  .actions button.act-done.on{background:var(--done); color:#06251a; border-color:transparent}
  .actions button.act-del{flex:0 0 auto; width:42px}
  .actions button.act-del:hover{background:rgba(255,107,107,.14); color:#ffb4b4; border-color:rgba(255,107,107,.4)}

  .empty{
    text-align:center; color:var(--muted); padding:64px 20px; border:1px solid var(--line);
    border-radius:8px; background:
      linear-gradient(180deg,rgba(5,9,19,.5),rgba(5,9,19,.9)),
      url("assets/game-library-hero.png") center/cover;
  }
  .empty .big{font-size:48px; margin-bottom:12px}
  .empty .t{font-size:20px; color:#fff; font-weight:900; margin-bottom:8px}
  .empty .s{font-size:14.5px; max-width:390px; margin:0 auto; line-height:1.7}

  /* ---------- plan modal ---------- */
  .overlay{position:fixed; inset:0; background:rgba(5,6,10,.78); backdrop-filter:blur(5px);
    display:none; align-items:flex-start; justify-content:center; padding:34px 16px; overflow:auto; z-index:70}
  .overlay.show{display:flex}
  .modal{background:var(--panel2); border:1px solid var(--line2); border-radius:8px; width:100%;
    max-width:840px; overflow:hidden; box-shadow:0 30px 80px -20px rgba(0,0,0,.9)}
  .modal header{display:flex; align-items:center; gap:12px; padding:20px 24px; border-bottom:1px solid var(--line)}
  .modal header h2{margin:0; font-size:20px; font-weight:800}
  .modal .x{margin-inline-start:auto; background:rgba(255,255,255,.07); border:0; color:#fff; width:34px;
    height:34px; border-radius:8px; cursor:pointer; font-size:16px; transition:.15s}
  .modal .x:hover{background:rgba(255,107,107,.2)}
  .modal .content{padding:22px 24px}
  .plan-ctrl{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-bottom:20px}
  .field{display:flex; flex-direction:column; gap:6px}
  .field label{font-size:12px; color:var(--muted); font-weight:600}
  .field input, .field select{background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:10px 13px; font-family:inherit; font-size:14px}
  .field input:focus, .field select:focus{outline:none; border-color:var(--accent)}
  .plan-summary{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px}
  .psum{flex:1; min-width:120px; background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:14px 16px; text-align:center}
  .psum b{display:block; font-size:26px; font-weight:800; color:var(--accent)}
  .psum span{font-size:11.5px; color:var(--muted); font-weight:500}
  .plan-list{display:flex; flex-direction:column; gap:8px; max-height:48vh; overflow:auto}
  .prow{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:10px 14px}
  .prow .num{width:28px; height:28px; border-radius:8px; background:var(--accent); color:#04101f;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex-shrink:0}
  .prow .pn{font-weight:700; direction:ltr; text-align:start; flex:1}
  .prow .ph{color:var(--muted); font-size:12px; white-space:nowrap}
  .prow .pw{color:var(--accent2); font-size:12px; white-space:nowrap; background:var(--accentSoft);
    padding:4px 10px; border-radius:8px; font-weight:600}

  /* ---------- toast ---------- */
  .toast{position:fixed; inset-block-end:26px; inset-inline:0; margin:auto; width:max-content; max-width:90%;
    color:#fff; padding:13px 24px; border-radius:8px; font-size:14.5px; font-weight:700; z-index:90;
    border:1px solid var(--line2); background:var(--panel2); box-shadow:0 20px 50px -16px rgba(0,0,0,.9);
    opacity:0; transform:translateY(14px); transition:.26s cubic-bezier(.2,.7,.3,1); pointer-events:none}
  .toast.show{opacity:1; transform:translateY(0)}
  .foot{color:var(--dim); font-size:12.5px; text-align:center; margin-top:38px; font-weight:500}

  @media(max-width:1040px){
    .hero-panel{grid-template-columns:1fr}
    .hero-art{min-height:240px}
  }
  @media(max-width:780px){
    .app{padding-inline:12px}
    .topline{grid-template-columns:1fr}
    .hero-copy{padding:22px; min-height:260px}
    .hero-copy h2{font-size:28px}
    .bento{grid-template-columns:repeat(2,1fr); grid-auto-rows:110px}
    .tile.play{grid-column:span 2; grid-row:span 2}
    .tile.plant{grid-column:span 2}
    .card.span2{grid-column:span 1}
    .libhead{align-items:flex-start}
    .controls{width:100%; margin-inline-start:0}
    .controls input[type=text]{width:100%}
    .seg{width:100%; overflow:auto}
  }
  @media(max-width:520px){
    .hero-panel{min-height:auto}
    .hero-art{min-height:190px}
    .grid{grid-template-columns:1fr}
    .play .pbtns{flex-direction:column}
    .timerow{flex-wrap:wrap}
  }
</style>
</head>
<body>
<div class="app">

  <div class="appbar">
    <div class="topline">
      <div class="brand">
        <div class="logo"><span>◆</span></div>
        <div>
          <h1>مكتبة ألعابي</h1>
          <p>Backlog Command Center</p>
        </div>
      </div>
      <div class="searchbox" id="searchbox">
        <div class="sfield">
          <input type="text" id="gameSearch" autocomplete="off"
                 placeholder="اكتب اسم لعبة... مثال: Elden Ring">
          <span class="sicon" id="sicon">⌕</span>
        </div>
        <div class="results" id="results"></div>
      </div>
    </div>
  </div>

  <section class="hero-panel" aria-label="لوحة مكتبة الألعاب">
    <div class="hero-copy">
      <div>
        <p class="eyebrow">RAWG + HLTB + Local Library</p>
        <h2>كل ألعابك، وقتها، وحالتها في لوحة واحدة.</h2>
        <p>ابحث، أضف، رتّب، وحدد اللعبة التالية بدون تسجيل أو حسابات.</p>
      </div>
      <div class="hero-stats" aria-label="مصادر وخصائص">
        <span>⌕ بحث مباشر</span>
        <span>⏱ أوقات اللعب</span>
        <span>▣ مكتبة محلية</span>
      </div>
    </div>
    <div class="hero-art" role="img" aria-label="مكتبة ألعاب منظمة على مكتب ألعاب">
      <div class="art-chip">
        <span>Backlog</span>
        <span>Playing</span>
        <span>Done</span>
      </div>
    </div>
  </section>

  <!-- bento dashboard -->
  <section class="bento" id="bento"></section>

  <!-- library -->
  <div class="libhead">
    <h2>المكتبة</h2>
    <span class="count" id="libCount"></span>
    <div class="controls">
      <div class="seg" id="statusSeg">
        <button data-f="all" class="active">الكل</button>
        <button data-f="backlog">القائمة</button>
        <button data-f="playing">ألعبها</button>
        <button data-f="done">خلّصت</button>
      </div>
      <button class="pickbtn" id="pickBtn">اقترح لي لعبة</button>
      <input type="text" id="filterSearch" placeholder="🔎 فلترة…">
      <select id="genre"><option value="">كل التصنيفات</option></select>
      <select id="viewMode">
        <option value="grid">عرض شبكي</option>
        <option value="genre">حسب التصنيف</option>
      </select>
      <select id="sort">
        <option value="rating">الأعلى تقييماً</option>
        <option value="short">الأقصر مدة</option>
        <option value="long">الأطول مدة</option>
        <option value="added">المضافة حديثاً</option>
        <option value="name">الاسم (A-Z)</option>
        <option value="year">الأحدث إصداراً</option>
      </select>
      <button class="ibtn" id="exportBtn" title="حفظ نسخة من مكتبتك">📤</button>
      <button class="ibtn" id="importBtn" title="استيراد مكتبة من ملف">📥</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty"></div>

  <div class="foot" id="foot"></div>
</div>

<!-- Plan modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <header>
      <h2>🗓️ خطة اللعب</h2>
      <button class="x" id="closePlan">✕</button>
    </header>
    <div class="content">
      <div class="plan-ctrl">
        <div class="field">
          <label>ساعات اللعب بالأسبوع</label>
          <input type="number" id="hpw" value="10" min="1" max="100" style="width:130px">
        </div>
        <div class="field">
          <label>الاستراتيجية</label>
          <select id="strategy">
            <option value="short">انتصارات سريعة (الأقصر أولاً)</option>
            <option value="rating">الأعلى تقييماً أولاً</option>
            <option value="balanced">متوازن (تقييم ÷ مدة)</option>
            <option value="long">الملاحم أولاً (الأطول)</option>
          </select>
        </div>
      </div>
      <div class="plan-summary" id="planSummary"></div>
      <div class="plan-list" id="planList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const RAWG_KEY = "031db013391842b4b38ab2ca874f98c5";
// نسخة GitHub Pages: بدون وسيط (Pages ما تشغّل دوال) — يستخدم متوسط RAWG.
// للأوقات الدقيقة استخدم نسخة Netlify.
const HLTB_PROXY = "";
const LIB_KEY  = "backlog_lib_v1";
const $ = s => document.querySelector(s);

function demoCover(title, c1, c2, mark){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/>
      </linearGradient>
      <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch" opacity=".22"/></filter>
    </defs>
    <rect width="960" height="540" fill="url(#g)"/>
    <rect width="960" height="540" filter="url(#noise)" opacity=".28"/>
    <circle cx="720" cy="120" r="210" fill="rgba(255,255,255,.13)"/>
    <circle cx="190" cy="415" r="170" fill="rgba(0,0,0,.22)"/>
    <path d="M120 376 C265 210 390 432 545 240 S770 206 850 120" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="18"/>
    <text x="70" y="104" fill="rgba(255,255,255,.9)" font-family="Arial, sans-serif" font-size="34" font-weight="800">${mark}</text>
    <text x="70" y="452" fill="#fff" font-family="Arial, sans-serif" font-size="56" font-weight="900">${title}</text>
  </svg>`;
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}
function seedDemoLibrary(){
  const now = Date.now();
  const demo = [
    ["Ashen Circuit",4.7,91,2026,["Action","Racing"],18,"playing",demoCover("Ashen Circuit","#233b36","#e95f4e","NEON RUN")],
    ["Moonlit Quarry",4.3,84,2025,["Adventure","Puzzle"],9,"backlog",demoCover("Moonlit Quarry","#101820","#2cc6a3","EXPLORE")],
    ["Iron Orchard",4.6,88,2024,["RPG","Strategy"],42,"backlog",demoCover("Iron Orchard","#3b2f1f","#f3b348","TACTICS")],
    ["Signal Beneath",4.1,79,2023,["Horror","Indie"],7,"done",demoCover("Signal Beneath","#171a17","#5b6d85","STATIC")],
    ["Crown of Salt",4.8,94,2026,["RPG","Open World"],66,"backlog",demoCover("Crown of Salt","#0f2027","#c99b55","MYTH")],
    ["Pixel Monsoon",3.9,75,2022,["Platformer","Arcade"],5,"done",demoCover("Pixel Monsoon","#23395b","#35c2ff","ARCADE")],
    ["Atlas Drift",4.4,86,2025,["Sci-Fi","Shooter"],13,"playing",demoCover("Atlas Drift","#18122b","#7f5af0","ORBIT")],
    ["Velvet Siege",4.2,81,2024,["Strategy","Simulation"],28,"backlog",demoCover("Velvet Siege","#2b1818","#d8644a","SIEGE")],
    ["Garden Zero",4.0,77,2023,["Cozy","Builder"],16,"backlog",demoCover("Garden Zero","#10251d","#70d38a","BUILD")],
    ["Last Lantern",4.5,89,2025,["Adventure","Narrative"],11,"done",demoCover("Last Lantern","#1b1d24","#f0a84a","STORY")]
  ].map((x,i)=>({
    id:900000+i, name:x[0], slug:"", rating:x[1], ratings_count:1200+i*271,
    metacritic:x[2], year:String(x[3]), genres:x[4], image:x[7], playtime:x[5],
    customHours:null, status:x[6], added:now-(i*86400000),
    hltb:{ main:x[5], mainExtra:Math.round(x[5]*1.7), completionist:Math.round(x[5]*2.6) }
  }));
  localStorage.setItem(LIB_KEY, JSON.stringify(demo));
}
if(new URLSearchParams(location.search).has("demo")){
  seedDemoLibrary();
  history.replaceState(null, "", location.pathname);
}

let LIBRARY = loadLib();
function loadLib(){ try{ return JSON.parse(localStorage.getItem(LIB_KEY)) || []; }catch(e){ return []; } }
function saveLib(){ localStorage.setItem(LIB_KEY, JSON.stringify(LIBRARY)); }
function inLib(id){ return LIBRARY.some(g=>g.id===id); }
function lenOf(g){
  if(g.customHours!=null) return g.customHours;
  if(g.hltb && g.hltb.main!=null) return g.hltb.main;
  return g.playtime||0;
}

/* ---------- أوقات HowLongToBeat عبر الوسيط ---------- */
let _hltbFails=0, _hltbOff=false;
async function fetchHLTB(g){
  if(!HLTB_PROXY || _hltbOff || g.hltb) return;
  try{
    const r = await fetch(`${HLTB_PROXY}?name=${encodeURIComponent(g.name)}`);
    if(!r.ok){ if(++_hltbFails>=4) _hltbOff=true; return; }   // الوسيط غايب — أوقف المحاولات
    _hltbFails=0;
    const d = await r.json();
    g.hltb = (d && d.matched)
      ? { main:d.main, mainExtra:d.mainExtra, completionist:d.completionist }
      : { main:null, mainExtra:null, completionist:null, noMatch:true };
    saveLib(); paintSoon();
  }catch(e){ if(++_hltbFails>=4) _hltbOff=true; }
}
let _hltbBusy=false;
async function backfillHLTB(){
  if(!HLTB_PROXY || _hltbBusy) return; _hltbBusy=true;
  for(const g of LIBRARY.filter(g=>!g.hltb)){
    await fetchHLTB(g);
    await new Promise(r=>setTimeout(r,350));   // لطيف على HLTB
  }
  _hltbBusy=false;
}

/* ---------- إعادة رسم مُجمَّعة (تمنع وميض التحديثات الخلفية) ---------- */
let _paintTimer=null;
function paintSoon(){ clearTimeout(_paintTimer); _paintTimer=setTimeout(()=>paint(), 300); }

let filter = { q:"", status:"all", genre:"", sort:"rating", view:"grid" };
let editingId = null;
let nextIdx = 0;
let recommendedId = null;

/* ---------- البحث المباشر عبر RAWG ---------- */
let searchTimer=null, searchSeq=0;
const sbox = $("#searchbox"), results = $("#results");
$("#gameSearch").addEventListener("input", e=>{
  const q = e.target.value.trim();
  clearTimeout(searchTimer);
  if(q.length < 2){ hideResults(); sbox.classList.remove("loading"); return; }
  searchTimer = setTimeout(()=>doSearch(q), 350);
});
$("#gameSearch").addEventListener("focus", e=>{
  if((e.target.value.trim().length>=2) && results.children.length) results.classList.add("show");
});
document.addEventListener("click", e=>{ if(!sbox.contains(e.target)) hideResults(); });
function hideResults(){ results.classList.remove("show"); }

async function doSearch(q){
  const seq = ++searchSeq;
  sbox.classList.add("loading");
  try{
    const url = `https://api.rawg.io/api/games?key=${RAWG_KEY}&search=${encodeURIComponent(q)}&page_size=10`;
    const r = await fetch(url);
    if(!r.ok) throw new Error("http "+r.status);
    const data = await r.json();
    if(seq !== searchSeq) return;
    renderResults(data.results||[]);
  }catch(err){
    if(seq !== searchSeq) return;
    results.innerHTML = `<div class="rnote">تعذّر البحث — تأكد من الاتصال بالإنترنت 📡</div>`;
    results.classList.add("show");
  }finally{ if(seq === searchSeq) sbox.classList.remove("loading"); }
}
function renderResults(list){
  if(!list.length){ results.innerHTML = `<div class="rnote">ما فيه نتائج 🤷 — جرّب اسم ثاني</div>`;
    results.classList.add("show"); return; }
  results.innerHTML = list.map(g=>{
    const yr=(g.released||"").slice(0,4), rt=g.rating?`★ ${g.rating.toFixed(1)}`:"";
    const mc=g.metacritic?` · MC ${g.metacritic}`:"";
    const img=g.background_image?`<img class="rthumb" loading="lazy" src="${g.background_image}" alt="">`:`<div class="rthumb noimg">🎮</div>`;
    const added=inLib(g.id);
    return `<div class="rrow" data-id="${g.id}">${img}
      <div class="rinfo"><div class="rname">${esc(g.name)}</div>
      <div class="rmeta">${yr||"—"} ${rt?("· "+rt):""}${mc}</div></div>
      <button class="radd ${added?'added':''}" ${added?'disabled':''}>${added?'✓ مُضافة':'＋ إضافة'}</button></div>`;
  }).join("");
  results.classList.add("show");
  [...results.querySelectorAll(".rrow")].forEach((row,i)=>{
    row.addEventListener("click", ()=>{ if(!inLib(list[i].id)) addGame(list[i]); });
  });
}
function addGame(g){
  if(inLib(g.id)) return;
  const ng = { id:g.id, name:g.name, slug:g.slug||"", rating:g.rating||0,
    ratings_count:g.ratings_count||0, metacritic:g.metacritic||null,
    year:(g.released||"").slice(0,4)||null, genres:(g.genres||[]).map(x=>x.name),
    image:g.background_image||null, playtime:g.playtime||0,
    customHours:null, status:"backlog", added:Date.now() };
  LIBRARY.push(ng);
  saveLib(); refreshGenres(); paint();
  fetchHLTB(ng);                            // يجيب أوقات HLTB بالخلفية (إن توفّر الوسيط)
  toast(`تمت إضافة "${g.name}" ✓`);
  const row = results.querySelector(`.rrow[data-id="${g.id}"] .radd`);
  if(row){ row.textContent="✓ مُضافة"; row.classList.add("added"); row.disabled=true; }
}

/* ---------- تصدير / استيراد ---------- */
$("#exportBtn").addEventListener("click", ()=>{
  if(!LIBRARY.length){ toast("مكتبتك فاضية — ما فيه شي تصدّره"); return; }
  const stamp = new Date().toISOString().slice(0,10);
  const blob = new Blob([JSON.stringify(LIBRARY,null,2)], {type:"application/json"});
  const a = document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`backlog-${stamp}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(`تم تصدير ${LIBRARY.length} لعبة 📤`);
});
$("#importBtn").addEventListener("click", ()=>$("#importFile").click());
$("#importFile").addEventListener("change", e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!Array.isArray(data)) throw new Error("not array");
      let added=0;
      for(const g of data){ if(g && g.id!=null && !inLib(g.id)){ LIBRARY.push(g); added++; } }
      saveLib(); refreshGenres(); paint();
      toast(added?`تم استيراد ${added} لعبة 📥`:"كل الألعاب موجودة عندك مسبقاً");
    }catch(err){ toast("ملف غير صالح ❌"); }
  };
  reader.readAsText(file); e.target.value="";
});

/* ---------- bento dashboard ---------- */
function balancedSort(arr){
  return arr.slice().sort((a,b)=>{
    const la=lenOf(a)||1, lb=lenOf(b)||1;
    return ((b.rating||0)/Math.sqrt(lb))-((a.rating||0)/Math.sqrt(la));
  });
}
function renderBento(){
  const bento=$("#bento");
  if(!LIBRARY.length){ bento.style.display="none"; bento.innerHTML=""; return; }
  bento.style.display="grid";
  const total=LIBRARY.length;
  const backlog=LIBRARY.filter(g=>g.status==="backlog");
  const playing=LIBRARY.filter(g=>g.status==="playing").length;
  const done=LIBRARY.filter(g=>g.status==="done").length;
  const hrs=Math.round(backlog.reduce((s,g)=>s+lenOf(g),0));
  const rated=LIBRARY.filter(g=>g.rating);
  const avg=rated.length?(rated.reduce((s,g)=>s+g.rating,0)/rated.length).toFixed(1):"—";
  const pct=total?Math.round(done/total*100):0;

  // play-next
  const cands=balancedSort(backlog);
  let playTile;
  if(cands.length){
    const g=cands[nextIdx%cands.length];
    const bg=g.image?`background-image:url('${g.image}')`:"background:#11141d";
    const star=g.rating?`<span class="pm star">★ ${g.rating.toFixed(1)}</span>`:"";
    const tm=lenOf(g)?`<span class="pm">⏱ ${lenOf(g)} ساعة</span>`:"";
    const gn=g.genres[0]?`<span class="pm">${esc(g.genres[0])}</span>`:"";
    playTile=`<div class="tile play" style="border-color:var(--line2)">
      <div class="pbg" style="${bg}"></div>
      <div class="pcontent">
        <span class="plabel">▶ العب التالي</span>
        <div class="ptitle">${esc(g.name)}</div>
        <div class="pmeta">${star}${tm}${gn}</div>
        <div class="pbtns">
          <button class="pbtn go" data-act="startnext" data-id="${g.id}">▶ ابدأها</button>
          ${cands.length>1?`<button class="pbtn alt" data-act="shuffle">↻ غيّرها</button>`:""}
        </div>
      </div></div>`;
  }else{
    playTile=`<div class="tile play empty"><div class="pe">
      <b>القائمة خلصت 🎉</b>${done?`خلّصت كل ألعابك — أضف جديد`:`ابحث وأضف ألعاب لتبدأ`}</div></div>`;
  }

  const ring=`<div class="tile ring">
    <div class="dial" style="background:conic-gradient(var(--accent) ${pct*3.6}deg, rgba(255,255,255,.08) 0)">
      <span class="dval">${pct}%</span></div>
    <div class="rlabel"><b>${done} من ${total}</b>نسبة الإنجاز</div></div>`;

  const stat=(cls,ico,num,label,f)=>`<div class="tile stat tap ${cls}" ${f?`data-filter="${f}"`:""}>
    <div class="stop"><span class="slabel">${label}</span><span class="sico">${ico}</span></div>
    <div class="snum">${num}</div></div>`;

  const planTile=`<div class="tile plant tap" data-act="plan">
    <div class="pico">🗓️</div>
    <div class="ptxt"><b>خطة اللعب</b><span>كم أسبوع تخلّص قائمتك؟</span></div>
    <span class="parrow">←</span></div>`;

  bento.innerHTML = playTile + ring
    + stat("c-blue","📋",backlog.length,"بالقائمة","backlog")
    + stat("c-play","▶",playing,"ألعبها الحين","playing")
    + stat("","⏱",hrs,"ساعة متبقية","")
    + stat("c-gold","★",avg,"متوسط التقييم","")
    + stat("c-done","✓",done,"خلّصتها","done")
    + planTile;
}
$("#bento").addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-filter]"); if(!t)return;
  const act=t.dataset.act;
  if(act==="startnext"){ const g=LIBRARY.find(x=>String(x.id)===t.dataset.id);
    if(g){ g.status="playing"; saveLib(); paint(); toast(`بالتوفيق في "${g.name}" 🎮`);} return; }
  if(act==="shuffle"){ nextIdx++; renderBento(); return; }
  if(act==="plan"){ openPlan(); return; }
  if(t.dataset.filter!=null){
    const f=t.dataset.filter;
    [...$("#statusSeg").children].forEach(b=>b.classList.toggle("active",b.dataset.f===f));
    filter.status=f; renderLibrary();
    document.querySelector('.libhead').scrollIntoView({behavior:"smooth",block:"start"});
  }
});

/* ---------- library ---------- */
function refreshGenres(){
  const cur=$("#genre").value;
  const all=[...new Set(LIBRARY.flatMap(g=>g.genres))].sort();
  $("#genre").innerHTML=`<option value="">كل التصنيفات</option>`+all.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
  if(all.includes(cur)) $("#genre").value=cur;
}
function visible(){
  return LIBRARY.filter(g=>{
    if(filter.status!=="all" && g.status!==filter.status) return false;
    if(filter.genre && !g.genres.includes(filter.genre)) return false;
    if(filter.q && !g.name.toLowerCase().includes(filter.q)) return false;
    return true;
  }).sort(cmp);
}
function cmp(a,b){
  switch(filter.sort){
    case "short": return (lenOf(a)||1e9)-(lenOf(b)||1e9);
    case "long":  return (lenOf(b)||0)-(lenOf(a)||0);
    case "added": return (b.added||0)-(a.added||0);
    case "name":  return a.name.localeCompare(b.name);
    case "year":  return (b.year||0)-(a.year||0);
    default:      return (b.rating||0)-(a.rating||0);
  }
}
function timeBlock(g){
  if(String(editingId)===String(g.id)){
    return `<div class="timewrap"><div class="hedit">
        <input type="number" step="0.5" min="0" id="hinp" value="${g.customHours!=null?g.customHours:(lenOf(g)||'')}" placeholder="ساعات القصة">
        <button class="hsave">✓</button><button class="hcancel">✕</button></div></div>`;
  }
  const cell=(label,v,cls="")=>`<div class="hcell ${cls}"><b>${v!=null?v+"س":"—"}</b><span>${label}</span></div>`;
  const h=g.hltb;
  if(h && (h.main!=null||h.mainExtra!=null||h.completionist!=null)){
    const mainV = g.customHours!=null ? g.customHours : h.main;
    return `<div class="timewrap">
      <div class="timerow">
        ${cell("القصة", mainV, g.customHours!=null?"custom":"")}
        ${cell("+إضافات", h.mainExtra)}
        ${cell("100%", h.completionist)}
      </div>
      <button class="tedit wide" data-a="edithours">✏️ تعديل وقت القصة</button></div>`;
  }
  const v=lenOf(g), custom=g.customHours!=null;
  const label = custom ? "وقتك" : (HLTB_PROXY ? "متوسط (جاري جلب HLTB…)" : "متوسط تقريبي");
  return `<div class="timewrap"><div class="timerow">
      ${cell(label, v||null, custom?"custom":"")}
      <button class="tedit" data-a="edithours" title="عدّل الساعات">✏️</button></div></div>`;
}
function card(g,i){
  const img=g.image?`<img loading="lazy" src="${g.image}" alt="" onerror="this.onerror=null;this.style.display='none'">`:`<div class="noimg">🎮</div>`;
  const rating=g.rating?`<div class="rating-chip">★ ${g.rating.toFixed(1)}</div>`:"";
  const genres=g.genres.slice(0,3).map(x=>`<span class="tag">${esc(x)}</span>`).join("");
  const year=g.year?`<span class="tag">${g.year}</span>`:"";
  const mc=g.metacritic?`<span class="tag mc" title="Metacritic">MC ${g.metacritic}</span>`:"";
  const link=g.slug?`https://rawg.io/games/${g.slug}`:"#";
  const span=g.status==="playing"?"span2":"";
  const reco=String(recommendedId)===String(g.id)?"recommended":"";
  return `<div class="card s-${g.status} ${span} ${reco}" data-id="${g.id}" style="animation-delay:${Math.min(i,12)*0.03}s">
    <div class="thumb">${img}${rating}
      <div class="badge-status">${g.status==="playing"?"▶ ألعبها":"✓ خلّصتها"}</div></div>
    <div class="body">
      <div class="title"><a href="${link}" target="_blank" rel="noopener">${esc(g.name)}</a></div>
      <div class="meta">${genres}${year}${mc}</div>
      ${timeBlock(g)}
      <div class="actions">
        <button class="act-play ${g.status==="playing"?"on":""}" data-a="playing">▶ ألعبها</button>
        <button class="act-done ${g.status==="done"?"on":""}" data-a="done">✓ خلّصت</button>
        <button class="act-del" data-a="del" title="حذف">🗑️</button></div>
    </div></div>`;
}
function renderLibrary(){
  const list=visible();
  if(filter.view==="genre" && list.length){
    const groups = new Map();
    for(const g of list){
      const name = filter.genre || g.genres[0] || "بدون تصنيف";
      if(!groups.has(name)) groups.set(name, []);
      groups.get(name).push(g);
    }
    $("#grid").className = "genre-groups";
    $("#grid").innerHTML = [...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([name,items])=>`
      <section class="genre-section">
        <h3 class="genre-title">${esc(name)} <span>${items.length}</span></h3>
        <div class="grid">${items.map((g,i)=>card(g,i)).join("")}</div>
      </section>`).join("");
  }else{
    $("#grid").className = "grid";
    $("#grid").innerHTML=list.map((g,i)=>card(g,i)).join("");
  }
  $("#libCount").textContent=LIBRARY.length?`${list.length} من ${LIBRARY.length}`:"";
  const emp=$("#empty");
  if(!LIBRARY.length){
    emp.innerHTML=`<div class="big">🎮</div><div class="t">مكتبتك فاضية</div>
      <div class="s">اكتب اسم أي لعبة في خانة البحث بالأعلى وأضفها لتبدأ</div>`;
    emp.style.display="block";
  }else if(!list.length){
    emp.innerHTML=`<div class="big">🤷</div><div class="t">ما فيه ألعاب تطابق الفلتر</div>`;
    emp.style.display="block";
  }else emp.style.display="none";
  $("#foot").innerHTML=LIBRARY.length?`البيانات محفوظة محلياً على جهازك · مصدر البيانات RAWG`:`ابدأ بإضافة لعبة — بدون تسجيل، بدون إيميل`;
}
function paint(){
  document.body.classList.toggle("has-library", LIBRARY.length>0);
  renderBento(); renderLibrary();
}

$("#filterSearch").addEventListener("input",e=>{filter.q=e.target.value.toLowerCase().trim();renderLibrary();});
$("#genre").addEventListener("change",e=>{filter.genre=e.target.value;renderLibrary();});
$("#sort").addEventListener("change",e=>{filter.sort=e.target.value;renderLibrary();});
$("#viewMode").addEventListener("change",e=>{filter.view=e.target.value;renderLibrary();});
$("#pickBtn").addEventListener("click",()=>{
  const pool=balancedSort(LIBRARY.filter(g=>g.status==="backlog"));
  if(!pool.length){ toast("ما فيه ألعاب في القائمة للاقتراح"); return; }
  const g=pool[0];
  recommendedId=g.id;
  filter.status="all";
  [...$("#statusSeg").children].forEach(b=>b.classList.toggle("active",b.dataset.f==="all"));
  renderLibrary();
  requestAnimationFrame(()=>{
    const el=$("#grid").querySelector(`.card[data-id="${g.id}"]`);
    if(el){ el.scrollIntoView({behavior:"smooth",block:"center"}); }
  });
  toast(`اقتراحي الآن: ${g.name}`);
});
$("#statusSeg").addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON")return;
  [...e.currentTarget.children].forEach(b=>b.classList.remove("active"));
  e.target.classList.add("active"); filter.status=e.target.dataset.f; renderLibrary();
});
$("#grid").addEventListener("click",e=>{
  const cardEl=e.target.closest(".card"); if(!cardEl)return;
  const id=cardEl.dataset.id; const g=LIBRARY.find(x=>String(x.id)===id); if(!g)return;
  if(e.target.classList.contains("hsave")){
    const v=parseFloat($("#hinp").value); g.customHours=(isNaN(v)||v<0)?null:v;
    editingId=null; saveLib(); paint(); return; }
  if(e.target.classList.contains("hcancel")){ editingId=null; renderLibrary(); return; }
  const btn=e.target.closest("button[data-a]"); if(!btn)return;
  const a=btn.dataset.a;
  if(a==="edithours"){ editingId=id; renderLibrary();
    const f=$("#grid").querySelector(`.card[data-id="${id}"] #hinp`); if(f){f.focus();f.select();} return; }
  if(a==="del"){ if(confirm(`حذف "${g.name}" من مكتبتك؟`)){
      LIBRARY=LIBRARY.filter(x=>String(x.id)!==id); saveLib(); refreshGenres(); paint(); } return; }
  g.status=(g.status===a)?"backlog":a; saveLib(); paint();
});

/* ---------- خطة اللعب ---------- */
function openPlan(){ $("#overlay").classList.add("show"); buildPlan(); }
function buildPlan(){
  const strat=$("#strategy").value, hpw=Math.max(1,+$("#hpw").value||10);
  let pool=LIBRARY.filter(g=>g.status==="backlog").map(g=>({name:g.name,len:lenOf(g),rating:g.rating||0})).filter(g=>g.len>0);
  const noLen=LIBRARY.filter(g=>g.status==="backlog").length-pool.length;
  pool.sort((a,b)=>{
    if(strat==="short")return a.len-b.len;
    if(strat==="long")return b.len-a.len;
    if(strat==="rating")return b.rating-a.rating;
    return (b.rating/Math.sqrt(b.len))-(a.rating/Math.sqrt(a.len));
  });
  let cum=0; const rows=pool.map((g,i)=>{cum+=g.len;return {i:i+1,name:g.name,len:g.len,wk:Math.ceil(cum/hpw)};});
  const tot=Math.round(cum), wks=Math.ceil(cum/hpw)||0;
  $("#planSummary").innerHTML=`
    <div class="psum"><b>${pool.length}</b><span>لعبة بالخطة</span></div>
    <div class="psum"><b>${tot}</b><span>ساعة إجمالي</span></div>
    <div class="psum"><b>${wks}</b><span>أسبوع</span></div>
    <div class="psum"><b>${(wks/4.34).toFixed(1)}</b><span>شهر تقريباً</span></div>`;
  $("#planList").innerHTML=pool.length
    ? rows.map(r=>`<div class="prow"><div class="num">${r.i}</div><div class="pn">${esc(r.name)}</div>
        <div class="ph">${r.len}س</div><div class="pw">أسبوع ${r.wk}</div></div>`).join("")
      +(noLen?`<div class="foot">+ ${noLen} لعبة بدون مدة محددة (غير مدرجة)</div>`:"")
    : `<div class="rnote">أضف ألعاب لقائمتك أول 🎮</div>`;
}
$("#closePlan").addEventListener("click",()=>$("#overlay").classList.remove("show"));
$("#overlay").addEventListener("click",e=>{if(e.target===$("#overlay"))$("#overlay").classList.remove("show");});
["#hpw","#strategy"].forEach(s=>$(s).addEventListener("input",buildPlan));

/* ---------- أدوات ---------- */
let toastTimer=null;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2400); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

refreshGenres(); paint(); backfillHLTB();
</script>
</body>
</html>
